<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting recording</title>
<style>body{font:15px system-ui,sans-serif;padding:16px;margin:0;color:#17251d;background:#f4f8f5}label{display:block;margin:12px 0}button{padding:10px 18px;background:#216346;color:white;border:0;border-radius:8px}progress{width:100%;height:22px}#detail{white-space:pre-wrap;overflow-wrap:anywhere}.note{color:#516357;font-size:13px}input{box-sizing:border-box;max-width:100%;font:inherit;padding:10px}input[type=text],input[type=date]{width:100%}button{min-height:44px}button:disabled{opacity:.6}</style></head>
<body><strong>SMARTINI’s — audio recap</strong>
<div id="picker">
<label>Meeting title *<br><input id="meeting-title" type="text" maxlength="150" required placeholder="Meeting title"></label>
<label>Meeting date *<br><input id="meeting-date" type="date" required></label>
<label>Participants (optional, comma-separated)<br><input id="participants" type="text" maxlength="500" placeholder="Names as provided; no speaker identification"></label>
<label>Choose your recording from Files<br><input id="audio" type="file" accept="audio/*,.m4a,.mp3,.wav,.mpeg,.mp4,.webm,.flac"></label><button id="upload">Upload &amp; generate recap</button></div>
<p id="phase">Waiting for recording</p><progress id="bar"></progress><p id="detail"></p>
<p class="note">Progress applies to the named stage, not estimated time remaining. After completion, the recap appears in the chat response. If the chat was interrupted, send “status JOB_ID” to retrieve it.</p>
<script>
const token="__TOKEN__", bar=document.getElementById('bar'), phase=document.getElementById('phase'), detail=document.getElementById('detail'), picker=document.getElementById('picker');
let uploading=false;
function show(stage,text,percent){phase.textContent=stage;detail.textContent=text;if(percent===null||percent===undefined){bar.removeAttribute('value')}else{bar.max=100;bar.value=percent}}
async function poll(){if(uploading)return;try{const r=await fetch('/meeting-ui/status/'+token,{credentials:'omit'});if(!r.ok)throw new Error('Session unavailable; start a new request');const j=await r.json();picker.hidden=j.state!=='waiting_upload';show(j.state.replaceAll('_',' '),j.detail+'\nJob: '+j.id+(j.error?'\n'+j.error:''),j.percent);if(j.state==='completed'||j.state==='failed')clearInterval(timer)}catch(e){show('Connection unavailable',e.message+'. Processing already queued continues on the server.',null)}}
document.getElementById('upload').onclick=()=>{const title=document.getElementById('meeting-title'),date=document.getElementById('meeting-date'),people=document.getElementById('participants');
const metadata={meeting_title:title.value.trim(),meeting_date:date.value,participants:people.value.split(',').map(s=>s.trim()).filter(Boolean)};
if(!metadata.meeting_title||!title.reportValidity()||!date.reportValidity()){show('Meeting details required','Enter a meeting title and date.',null);return}
const encoded=encodeURIComponent(JSON.stringify(metadata));
if(metadata.participants.length>20||metadata.participants.some(s=>s.length>100)||encoded.length>6000){show('Check participants','Use up to 20 names, each up to 100 characters; shorten details if needed.',null);return}
const file=document.getElementById('audio').files[0];if(!file){show('Choose a file','Select your meeting recording first.',null);return}if(file.size>512*1024*1024){show('File too large','Maximum upload size is 512 MiB.',null);return}uploading=true;document.getElementById('upload').disabled=true;const xhr=new XMLHttpRequest();xhr.open('POST','/meeting-ui/upload/'+token);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.setRequestHeader('X-Meeting-Metadata',encoded);xhr.setRequestHeader('X-Filename',encodeURIComponent(file.name));xhr.upload.onprogress=e=>show('Uploading to SMARTINI’s',file.name,e.lengthComputable?100*e.loaded/e.total:null);xhr.onload=()=>{uploading=false;document.getElementById('upload').disabled=false;if(xhr.status===202){picker.hidden=true;poll()}else{let message=xhr.responseText;try{message=JSON.parse(message).error}catch(e){}show('Upload failed',message,null)}};xhr.onerror=()=>{uploading=false;document.getElementById('upload').disabled=false;show('Upload connection lost','Retry while this session is waiting for a file.',null)};xhr.send(file)};
const timer=setInterval(poll,3000);poll();
function reportHeight(){parent.postMessage({type:'iframe:height',height:document.documentElement.scrollHeight},'*')}
window.addEventListener('load',reportHeight);new ResizeObserver(reportHeight).observe(document.body);
</script></body></html>
